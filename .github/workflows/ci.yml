name: Validate PokerHub
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build && npm audit --audit-level=high
        working-directory: web
  api-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore active projects
        run: |
          dotnet tool restore
          dotnet restore tests/PokerHub.Application.Tests '-p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904'
          dotnet restore tests/PokerHub.Api.Tests '-p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904'
      - name: Unit and SQL integration tests
        run: |
          dotnet test tests/PokerHub.Application.Tests -c Release --no-restore --logger trx
          dotnet test tests/PokerHub.Api.Tests -c Release --no-restore --logger trx
      - name: Prepare local stack
        run: |
          npm ci --prefix web
          bash scripts/dev.sh db
          bash scripts/dev.sh migrate
          bash scripts/dev.sh api > /tmp/pokerhub-api.log 2>&1 &
          bash scripts/dev.sh web > /tmp/pokerhub-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5100/health && curl -fsS -o /dev/null http://127.0.0.1:5173; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify generated API contracts
        working-directory: web
        run: npm run api:generate && git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Stop local database
        if: always()
        run: bash scripts/dev.sh stop
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/
            web/test-results/
          if-no-files-found: ignore
