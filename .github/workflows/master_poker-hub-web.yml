name: Build and deploy React app to Azure Static Web Apps

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POKERHUB_WEB }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          skip_deploy_on_missing_secrets: true
          ###### Repository/Build Configurations ######
          app_location: "web" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app path
          ###### End of Repository/Build Configurations ######
